packages:
    - "apps/*"
    - "packages/*"
catalog:
    typescript: ^7.0.2
    react: "^19.3.1"
    react-dom: "^19.3.1"
allowBuilds:
    # Postinstall only prints an "astryx init" hint.
    "@astryxdesign/cli": false
    "@astryxdesign/core": false
    # Platform binary checks for wrangler/vitest (esbuild bundler, workerd runtime).
    esbuild: true
    workerd: true
    # Runs `lefthook install` to set up the git hooks (skipped in CI).
    lefthook: true
